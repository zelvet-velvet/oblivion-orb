# Builds the Windows app on GitHub's machines, so testing needs no local toolchain.
# Run by hand (Actions › Build Windows app › Run workflow, or `gh workflow run build.yml`); the .exe is kept 3 days as an
# artifact. Not a release: Riot asks for registration before a build is shared.
name: Build Windows app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Morellonomicon data (tiers, builds, augment, champion and item notes)
        uses: actions/checkout@v4
        with:
          repository: zelvet-velvet/Morellonomicon
          path: Morellonomicon
          sparse-checkout: |
            _data/augment-tiers.json
            _data/item-builds.json
            強化
            英雄
            道具
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the overlay data
        run: python -I tools/build_data.py --from Morellonomicon

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build the app
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: oblivion-orb-windows
          retention-days: 3
          path: |
            src-tauri/target/release/oblivion-orb.exe
            src-tauri/target/release/bundle/nsis/*.exe
