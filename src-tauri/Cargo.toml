[package]
name = "oblivion-orb"
version = "0.1.0"
description = "遺忘寶珠: an ARAM Mayhem augment overlay"
authors = ["Zaviel"]
license = "MIT"
edition = "2021"

[lib]
name = "oblivion_orb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# the client's local APIs (127.0.0.1, Riot's own certificate): native TLS is Windows' SChannel, no C to build
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
# Shift held, read the way any hotkey app does (no game memory); the card areas of the screen (GDI); our window kept out
# of our own capture; the game window's place (DWM)
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }
# Windows' own OCR (Windows.Media.Ocr) for the card names; with 直播顯示 on, the game's window copied by Windows Graphics
# Capture (Direct3D 11)
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Globalization", "Storage_Streams", "Foundation", "Win32_System_WinRT",
  "Graphics_Capture", "Graphics_DirectX", "Graphics_DirectX_Direct3D11", "Security_Authorization_AppCapabilityAccess",
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture"] }
